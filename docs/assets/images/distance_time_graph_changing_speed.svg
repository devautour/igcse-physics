<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 300" width="420" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Distance-time graph showing two curves: a red curve whose gradient decreases over time, representing an object slowing down, and a green curve whose gradient increases over time, representing an object speeding up.">
    <line x1="50" y1="10" x2="50" y2="260" stroke="#333333" stroke-width="2"/>
    <line x1="50" y1="260" x2="400" y2="260" stroke="#333333" stroke-width="2"/>
    <path d="M 50 260 C 150 120, 250 60, 380 40" stroke="#c0392b" stroke-width="2.5" fill="none"/>
    <path d="M 50 260 C 150 240, 250 190, 380 40" stroke="#27ae60" stroke-width="2.5" fill="none"/>
    <text x="330" y="35" font-size="13" font-family="sans-serif" fill="#c0392b" font-weight="bold">slowing down</text>
    <text x="300" y="200" font-size="13" font-family="sans-serif" fill="#27ae60" font-weight="bold">speeding up</text>
    <text x="225" y="285" font-size="13" font-family="sans-serif" text-anchor="middle" fill="#222222">Time</text>
    <text x="18" y="135" font-size="13" font-family="sans-serif" text-anchor="middle" fill="#222222" transform="rotate(-90 18 135)">Distance</text>
</svg>
