<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 300" width="420" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Distance-time graph showing two straight lines from the origin: a steep blue line representing a larger constant speed, and a shallower orange line representing a smaller constant speed.">
    <line x1="50" y1="10" x2="50" y2="260" stroke="#333333" stroke-width="2"/>
    <line x1="50" y1="260" x2="400" y2="260" stroke="#333333" stroke-width="2"/>
    <line x1="50" y1="260" x2="330" y2="30" stroke="#2b6cb0" stroke-width="2.5"/>
    <line x1="50" y1="260" x2="380" y2="170" stroke="#c05621" stroke-width="2.5"/>
    <text x="335" y="26" font-size="13" font-family="sans-serif" fill="#2b6cb0" font-weight="bold">larger speed</text>
    <text x="290" y="167" font-size="13" font-family="sans-serif" fill="#c05621" font-weight="bold">smaller speed</text>
    <text x="225" y="285" font-size="13" font-family="sans-serif" text-anchor="middle" fill="#222222">Time</text>
    <text x="18" y="135" font-size="13" font-family="sans-serif" text-anchor="middle" fill="#222222" transform="rotate(-90 18 135)">Distance</text>
</svg>
