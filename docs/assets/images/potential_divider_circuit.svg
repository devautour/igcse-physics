<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 480 340" width="480" height="340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="potential-divider-title">
    <title id="potential-divider-title">Potential divider circuit: a supply Vin connected across two resistors R1 and R2 in series, with the output voltage Vout taken across R2</title>

    <!-- top wire -->
    <line x1="100" y1="60" x2="380" y2="60" stroke="#333333" stroke-width="2.5"/>
    <!-- bottom wire -->
    <line x1="380" y1="320" x2="100" y2="320" stroke="#333333" stroke-width="2.5"/>

    <!-- battery: left wire with cell symbol -->
    <line x1="100" y1="60" x2="100" y2="170" stroke="#333333" stroke-width="2.5"/>
    <line x1="80" y1="170" x2="120" y2="170" stroke="#333333" stroke-width="2.5"/>
    <line x1="88" y1="210" x2="112" y2="210" stroke="#333333" stroke-width="6"/>
    <line x1="100" y1="210" x2="100" y2="320" stroke="#333333" stroke-width="2.5"/>
    <text x="66" y="195" text-anchor="end" font-size="16" font-family="sans-serif" font-weight="bold" fill="#222222">V<tspan baseline-shift="sub" font-size="11">in</tspan></text>
    <text x="128" y="167" text-anchor="start" font-size="14" font-family="sans-serif" fill="#222222">+</text>
    <text x="128" y="216" text-anchor="start" font-size="14" font-family="sans-serif" fill="#222222">&#8722;</text>

    <!-- R1 zigzag -->
    <polyline points="380,60 380,72 362,82 398,94 362,106 398,118 362,130 380,140 380,190" fill="none" stroke="#333333" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="412" y="110" text-anchor="start" font-size="16" font-family="sans-serif" font-weight="bold" fill="#222222">R<tspan baseline-shift="sub" font-size="11">1</tspan></text>

    <!-- junction -->
    <circle cx="380" cy="190" r="4.5" fill="#333333"/>

    <!-- R2 zigzag -->
    <polyline points="380,190 380,202 362,212 398,224 362,236 398,248 362,260 380,270 380,320" fill="none" stroke="#333333" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="412" y="240" text-anchor="start" font-size="16" font-family="sans-serif" font-weight="bold" fill="#222222">R<tspan baseline-shift="sub" font-size="11">2</tspan></text>

    <!-- Vout tap -->
    <line x1="380" y1="190" x2="440" y2="190" stroke="#333333" stroke-width="1.5" stroke-dasharray="5,4"/>
    <line x1="380" y1="320" x2="440" y2="320" stroke="#333333" stroke-width="1.5" stroke-dasharray="5,4"/>
    <line x1="440" y1="190" x2="440" y2="320" stroke="#333333" stroke-width="2"/>
    <line x1="434" y1="190" x2="440" y2="190" stroke="#333333" stroke-width="2"/>
    <line x1="434" y1="320" x2="440" y2="320" stroke="#333333" stroke-width="2"/>
    <text x="452" y="260" text-anchor="start" font-size="16" font-family="sans-serif" font-weight="bold" fill="#222222">V<tspan baseline-shift="sub" font-size="11">out</tspan></text>
</svg>
