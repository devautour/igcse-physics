<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 300" width="420" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Velocity-time graph showing a red straight line with a positive gradient, starting low and ending high, representing increasing velocity, and a green straight line with a negative gradient, starting high and ending low, representing decreasing velocity.">
    <line x1="50" y1="10" x2="50" y2="260" stroke="#333333" stroke-width="2"/>
    <line x1="50" y1="260" x2="400" y2="260" stroke="#333333" stroke-width="2"/>
    <line x1="50" y1="230" x2="380" y2="40" stroke="#c0392b" stroke-width="2.5"/>
    <line x1="50" y1="40" x2="380" y2="230" stroke="#27ae60" stroke-width="2.5"/>
    <text x="270" y="35" font-size="13" font-family="sans-serif" fill="#c0392b" font-weight="bold">increasing velocity</text>
    <text x="240" y="245" font-size="13" font-family="sans-serif" fill="#27ae60" font-weight="bold">decreasing velocity</text>
    <text x="225" y="285" font-size="13" font-family="sans-serif" text-anchor="middle" fill="#222222">Time</text>
    <text x="18" y="135" font-size="13" font-family="sans-serif" text-anchor="middle" fill="#222222" transform="rotate(-90 18 135)">Velocity</text>
</svg>
