<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 300" width="420" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Velocity-time graph showing one continuous journey in three phases: an upward-sloping straight line representing constant acceleration, followed by a flat horizontal line representing constant velocity, followed by a downward-sloping straight line back to zero representing constant deceleration.">
    <line x1="50" y1="10" x2="50" y2="260" stroke="#333333" stroke-width="2"/>
    <line x1="50" y1="260" x2="400" y2="260" stroke="#333333" stroke-width="2"/>
    <line x1="50" y1="260" x2="160" y2="90" stroke="#2b6cb0" stroke-width="2.5"/>
    <line x1="160" y1="90" x2="270" y2="90" stroke="#2b6cb0" stroke-width="2.5"/>
    <line x1="270" y1="90" x2="380" y2="260" stroke="#2b6cb0" stroke-width="2.5"/>
    <line x1="160" y1="260" x2="160" y2="270" stroke="#333333" stroke-width="1.5"/>
    <line x1="270" y1="260" x2="270" y2="270" stroke="#333333" stroke-width="1.5"/>
    <text x="80" y="200" font-size="12" font-family="sans-serif" fill="#222222">constant</text>
    <text x="70" y="215" font-size="12" font-family="sans-serif" fill="#222222">acceleration</text>
    <text x="175" y="80" font-size="12" font-family="sans-serif" fill="#222222">constant velocity</text>
    <text x="290" y="200" font-size="12" font-family="sans-serif" fill="#222222">constant</text>
    <text x="290" y="215" font-size="12" font-family="sans-serif" fill="#222222">deceleration</text>
    <text x="225" y="285" font-size="13" font-family="sans-serif" text-anchor="middle" fill="#222222">Time</text>
    <text x="18" y="135" font-size="13" font-family="sans-serif" text-anchor="middle" fill="#222222" transform="rotate(-90 18 135)">Velocity</text>
</svg>
